name: Notion Client Monitor

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Monitor Notion Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run monitor script
        id: monitor
        run: |
          chmod +x scripts/notion-monitor.sh
          bash scripts/notion-monitor.sh 2>&1 | tee monitor-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Create or update issue if changes detected
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('monitor-output.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);

            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'notion-change',
              state: 'open',
              per_page: 1
            });

            const body = [
              '## Notion Client-Side Change Detected',
              '',
              'The daily monitor has detected changes in Notion\'s client-side code that may affect Worknot\'s proxy functionality.',
              '',
              '### Details',
              '',
              '```',
              output,
              '```',
              '',
              '### Action Required',
              '',
              '1. Review the changes above',
              '2. Test Worknot proxy against a live Notion site',
              '3. Update `baselines/notion-snapshot.json` if changes are benign',
              '4. Fix proxy logic in `src/code.ts` if breaking changes found',
            ].join('\n');

            if (existing.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `### Update ${date}\n\n` + body
              });
              console.log(`Added comment to existing issue #${existing.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Notion client-side change detected - ${date}`,
                body: body,
                labels: ['notion-change']
              });
              console.log('Created new issue');
            }

  render-check:
    name: Render Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Exit code 1 is a rendering regression; 2 means the check could not run
      - name: Run render check
        id: render
        run: |
          set +e
          npm run check:render 2>&1 | tee render-output.txt
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "1" ] && exit 0
          exit "$code"

      - name: Create or update issue if rendering broke
        if: steps.render.outputs.exit_code == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('render-output.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              '## Rendering regression detected',
              '',
              'The daily render check (`npm run check:render`) found features that work on notion.site but break through a generated Worknot worker.',
              '',
              '```',
              output.split('\n').filter((line) => /^(PASS|FAIL|NOTION|SKIP)/.test(line)).join('\n'),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'render-regression',
              state: 'open',
              per_page: 1
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `### Update ${date}\n\n` + body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Rendering regression detected - ${date}`,
                body: body,
                labels: ['render-regression']
              });
            }

      - name: Fail on rendering regression
        if: steps.render.outputs.exit_code == '1'
        run: exit 1
